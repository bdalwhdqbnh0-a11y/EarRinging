name: Build mod

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download AML headers and miniaudio
        run: |
          mkdir -p include third_party
          git clone --depth 1 https://github.com/RusJJ/AndroidModLoader aml_src
          cp -r aml_src/mod include/mod
          curl -fsSL -o third_party/miniaudio.h https://raw.githubusercontent.com/mackron/miniaudio/master/miniaudio.h

      - name: Build arm64-v8a
        run: |
          cmake -B build -S . \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: EarRinging-arm64
          path: build/libEarRinging.so

      - name: Upload MyHUD
        uses: actions/upload-artifact@v4
        with:
          name: MyHUD-arm64
          path: build/libMyHUD.so

      - name: Upload SanVive
        uses: actions/upload-artifact@v4
        with:
          name: SanVive-arm64
          path: build/libSanVive.so

      - name: Upload SleekMove
        uses: actions/upload-artifact@v4
        with:
          name: SleekMove-arm64
          path: build/libSleekMove.so

      - name: Upload EarShot
        uses: actions/upload-artifact@v4
        with:
          name: EarShot-arm64
          path: build/libEarShot.so

      - name: Publish download link (release "latest")
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          files: |
            build/libEarRinging.so
            build/libMyHUD.so
            build/libSanVive.so
            build/libSleekMove.so
            build/libEarShot.so
